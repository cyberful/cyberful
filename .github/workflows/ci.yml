name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  check:
    name: Typecheck, test, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix mcps
      - run: make typecheck test-bun test-python
      - name: Build documentation
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: uv run --with-requirements docs-requirements.txt mkdocs build --strict
