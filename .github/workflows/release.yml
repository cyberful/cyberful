# ── Stable Release Publication ──────────────────────────────────────
# Verifies, builds, stages, and publishes one immutable native Cyberful release,
# including an integrity-checked recovery path for a partially published version.
# @docs/development/release.md
# ────────────────────────────────────────────────────────────────────

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to publish, without the v prefix
        required: true
        default: 0.1.0
        type: string
      dry_run:
        description: Verify, build, and assemble without tagging or publishing
        required: true
        default: true
        type: boolean
      resume_run_id:
        description: Failed Release run ID whose staged artifacts should resume
        required: false
        default: ""
        type: string

concurrency:
  group: npm-stable-release
  queue: max

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.4.0
  NPM_VERSION: 11.5.1

jobs:
  verify:
    name: Verify release input and source
    if: inputs.resume_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Require main and a new stable version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$DEFAULT_BRANCH" != main || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Releases require refs/heads/main and main must be the default branch." >&2
            exit 1
          fi
          bun -e 'import semver from "semver"; const version = process.env.RELEASE_VERSION ?? ""; if (!semver.valid(version) || semver.prerelease(version)) throw new Error(`Release version must be stable SemVer: ${version || "<empty>"}`)'
          tag="v$RELEASE_VERSION"
          latest="$(
            git tag --list 'v*' \
              | bun -e '
                  import semver from "semver";
                  const tags = (await Bun.stdin.text())
                    .split(/\s+/)
                    .filter(Boolean)
                    .map((tag) => ({ tag, version: tag.slice(1) }))
                    .filter(({ version }) => semver.valid(version) && !semver.prerelease(version))
                    .sort((left, right) => semver.rcompare(left.version, right.version));
                  if (tags[0]) process.stdout.write(tags[0].tag);
                '
          )"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            test "$latest" = "$tag"
            exit 0
          fi
          if [[ -n "$latest" ]]; then
            LATEST_VERSION="${latest#v}" bun -e 'import semver from "semver"; const next = process.env.RELEASE_VERSION ?? ""; const latest = process.env.LATEST_VERSION ?? ""; if (!semver.gt(next, latest)) throw new Error(`${next} must be greater than ${latest}`)'
          fi
      - run: npm ci --prefix mcps
      - run: make typecheck test-bun test-python

  attack-snapshot:
    name: Prepare MITRE ATT&CK release snapshot
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CYBERFUL_VERSION: ${{ inputs.version }}
      CYBERFUL_BUILD_ID: ${{ inputs.version }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Resolve and validate one official ATT&CK snapshot
        shell: bash
        run: >-
          bun cyberful/script/mitre-attack-snapshot.ts
          --output mitre-attack-snapshot
          --cyberful-version "$CYBERFUL_VERSION"
          --build-id "$CYBERFUL_BUILD_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mitre-attack-snapshot
          path: mitre-attack-snapshot
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: [verify, attack-snapshot]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 and baseline
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
            targets: cyberful-linux-x64,cyberful-linux-x64-baseline
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
            targets: cyberful-darwin-arm64
          - name: macOS Intel and baseline
            runner: macos-15-intel
            platform: darwin
            architecture: x64
            targets: cyberful-darwin-x64,cyberful-darwin-x64-baseline
          - name: Windows x64 and baseline
            runner: windows-2025
            platform: windows
            architecture: x64
            targets: cyberful-windows-x64,cyberful-windows-x64-baseline
    env:
      CYBERFUL_VERSION: ${{ inputs.version }}
      CYBERFUL_CHANNEL: latest
      CYBERFUL_BUILD_ID: ${{ inputs.version }}-${{ github.sha }}
      BUILD_TARGETS: ${{ matrix.targets }}
      PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      CYBERFUL_MITRE_ATTACK_SNAPSHOT_DIR: ${{ github.workspace }}/mitre-attack-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix mcps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: mitre-attack-snapshot
          path: mitre-attack-snapshot
      - name: Stage the pinned Bun Windows baseline compiler
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          compiler_dir="$(mktemp -d)"
          trap 'rm -rf "$compiler_dir"' EXIT
          archive="$(
            npm pack \
              --silent \
              --ignore-scripts \
              --pack-destination "$compiler_dir" \
              "@oven/bun-windows-x64-baseline@$BUN_VERSION"
          )"
          test "$archive" = "oven-bun-windows-x64-baseline-$BUN_VERSION.tgz"
          tar -xOf "$compiler_dir/$archive" package/bin/bun.exe \
            > "cyberful/bun-windows-x64-baseline-v$BUN_VERSION"
          test -s "cyberful/bun-windows-x64-baseline-v$BUN_VERSION"
      - name: Build native binaries
        shell: bash
        run: bun run --cwd cyberful build --target "$BUILD_TARGETS" --skip-install
      - name: Verify every binary embeds the local runtime context
        shell: bash
        run: |
          bun -e '
            import fs from "node:fs";
            import path from "node:path";
            const root = path.resolve("cyberful/dist");
            const manifest = JSON.parse(fs.readFileSync(path.join(root, "runtime-manifest.json"), "utf8"));
            const attack = JSON.parse(fs.readFileSync(path.join(root, "mitre-attack-manifest.json"), "utf8"));
            const prepared = JSON.parse(fs.readFileSync(path.resolve("mitre-attack-snapshot/manifest.json"), "utf8"));
            const binaries = fs.readdirSync(root, { recursive: true, withFileTypes: true })
              .filter((entry) => entry.isFile() && (entry.name === "cyberful" || entry.name === "cyberful.exe"))
              .map((entry) => path.join(entry.parentPath, entry.name));
            if (!/^[0-9a-f]{64}$/.test(manifest.fingerprint) || !manifest.files.includes("cyberful-os/Dockerfile") || !binaries.length) throw new Error("Embedded runtime manifest or release binary is missing");
            if (JSON.stringify(attack) !== JSON.stringify(prepared)) throw new Error("Build did not preserve the prepared MITRE ATT&CK snapshot manifest");
            for (const binary of binaries) {
              if (!fs.readFileSync(binary).includes(Buffer.from(manifest.fingerprint))) throw new Error(`${binary} does not embed runtime fingerprint ${manifest.fingerprint}`);
              const bytes = fs.readFileSync(binary);
              if (!bytes.includes(Buffer.from(attack.snapshot_id)) || !bytes.includes(Buffer.from(attack.database.sha256))) throw new Error(`${binary} does not embed MITRE ATT&CK snapshot ${attack.snapshot_id}`);
            }
          '
      - name: Smoke the embedded MITRE ATT&CK MCP without network
        shell: bash
        run: >-
          bun cyberful/script/smoke-mitre-attack-binary.ts
          --root cyberful/dist
          --manifest cyberful/dist/mitre-attack-manifest.json
      - name: Pack platform package
        shell: bash
        run: >-
          bun cyberful/script/package-npm.ts
          --platform "$PACKAGE_PLATFORM"
          --arch "$PACKAGE_ARCHITECTURE"
          --version "$CYBERFUL_VERSION"
          --output cyberful/dist/npm-platform
      - name: Pack launcher for the local smoke test
        shell: bash
        run: >-
          bun cyberful/script/package-npm.ts
          --meta
          --version "$CYBERFUL_VERSION"
          --output cyberful/dist/npm-meta-smoke
      - name: Install and execute the packed packages
        shell: bash
        run: >-
          bun cyberful/script/smoke-npm.ts
          --platform-package cyberful/dist/npm-platform/packages/*.tgz
          --meta-package cyberful/dist/npm-meta-smoke/packages/*.tgz
          --version "$CYBERFUL_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: native-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            cyberful/dist/npm-platform/packages/*.tgz
            cyberful/dist/mitre-attack-manifest.json
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: native-*
          path: release-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: mitre-attack-snapshot
          path: release-inputs/mitre-attack-snapshot
      - name: Create native archives
        shell: bash
        run: >-
          bun scripts/prepare-release-assets.ts
          --input release-inputs
          --output release-assets
          --version "$RELEASE_VERSION"
      - name: Pack the public launcher
        shell: bash
        run: >-
          bun cyberful/script/package-npm.ts
          --meta
          --version "$RELEASE_VERSION"
          --output release-meta
      - name: Add the launcher to the release set
        shell: bash
        run: cp release-meta/packages/*.tgz release-assets/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets/cyberful-v${{ inputs.version }}.spdx.json
          artifact-name: cyberful-v${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: bun scripts/write-checksums.ts release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-v${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: Stage the GitHub Release
    if: inputs.dry_run != true
    needs: [assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    permissions:
      contents: write # Create the annotated tag, draft release, and immutable assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-v${{ inputs.version }}
          path: release-assets
      - name: Create or verify the release tag
        env:
          TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$TAG")" = tag
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f "tag=$TAG" \
              -f "message=Cyberful $TAG" \
              -f "object=$GITHUB_SHA" \
              -f type=commit \
              --jq .sha)"
            [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$tag_object"
          fi
      - id: release
        name: Create or verify the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          release_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id"
          )"

          # ── Draft Identity Comes From The Mutation Boundary ───────────────
          # GitHub can accept a draft release and still omit it briefly from
          # the authenticated list endpoint. A successful creation therefore
          # supplies its own numeric identity directly from the POST response.
          # If creation instead collides with a draft that is not visible yet,
          # bounded discovery recovers that same release without duplicating it.
          # ──────────────────────────────────────────────────────────────────
          if [[ -z "$release_ids" ]]; then
            create_error="$(mktemp)"
            trap 'rm -f "$create_error"' EXIT
            if release_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f "tag_name=$TAG" \
                -f "name=$TAG" \
                -F draft=true \
                -F generate_release_notes=true \
                --jq .id \
                2>"$create_error"
            )"; then
              release_ids="$release_id"
            else
              retry_delays=(2 4 8 16 30)
              for retry_delay in "${retry_delays[@]}"; do
                sleep "$retry_delay"
                release_ids="$(
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                    --jq ".[] | select(.tag_name == \"$TAG\") | .id"
                )"
                [[ -n "$release_ids" ]] && break
              done
              if [[ -z "$release_ids" ]]; then
                cat "$create_error" >&2
                exit 1
              fi
            fi
          fi
          if [[ "$release_ids" == *$'\n'* || ! "$release_ids" =~ ^[0-9]+$ ]]; then
            echo "Expected exactly one GitHub Release for $TAG." >&2
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_ids" --jq .tag_name)" = "$TAG"
          echo "release_id=$release_ids" >> "$GITHUB_OUTPUT"
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          bun scripts/upload-release-assets.ts
          --tag "v$RELEASE_VERSION"
          --release-id "${{ steps.release.outputs.release_id }}"
          --directory release-assets

  publish-npm:
    name: Publish npm packages
    if: inputs.dry_run != true
    needs: [assemble, stage-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
      id-token: write # Authenticate npm trusted publishing through GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-v${{ inputs.version }}
          path: release-assets
      - name: Publish platform packages, then the launcher
        shell: bash
        run: >-
          bun scripts/publish-npm.ts
          --directory release-assets
          --version "$RELEASE_VERSION"

  publish-release:
    name: Publish the GitHub Release
    if: inputs.dry_run != true
    needs: [publish-npm, stage-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Publish the fully staged GitHub Release.
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true \
            --silent
          for attempt in {1..12}; do
            state="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                --jq '[.tag_name, (.draft | tostring), (.immutable | tostring)] | @tsv'
            )"
            if [[ "$state" = "$TAG"$'\tfalse\ttrue' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Release $TAG was not published and locked as immutable." >&2
          exit 1

  resume-release:
    name: Resume npm and publish release
    if: inputs.resume_run_id != '' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # Download the exact staged artifact from the failed release run.
      contents: write # Reconcile the draft assets and publish the existing release.
      id-token: write # Authenticate npm trusted publishing through GitHub OIDC.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"
      - run: bun install --frozen-lockfile
      - id: release
        name: Require the failed run, original tag, and draft release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$DEFAULT_BRANCH" != main || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Release recovery requires refs/heads/main and main must be the default branch." >&2
            exit 1
          fi
          [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RESUME_RUN_ID" != "$GITHUB_RUN_ID"
          bun -e 'import semver from "semver"; const version = process.env.RELEASE_VERSION ?? ""; if (!semver.valid(version) || semver.prerelease(version)) throw new Error(`Release version must be stable SemVer: ${version || "<empty>"}`)'

          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)"
          run_state="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" \
              --jq '[.workflow_id, .event, .status, .conclusion, .head_branch, .head_sha] | @tsv'
          )"
          IFS=$'\t' read -r run_workflow run_event run_status run_conclusion run_branch run_sha <<< "$run_state"
          test "$run_workflow" = "$workflow_id"
          test "$run_event" = workflow_dispatch
          test "$run_status" = completed
          test "$run_conclusion" = failure
          test "$run_branch" = main
          [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]]

          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$run_sha"
          latest="$(git tag --list 'v*' | bun -e 'import semver from "semver"; const tags = (await Bun.stdin.text()).split(/\s+/).filter(Boolean).filter((tag) => semver.valid(tag.slice(1)) && !semver.prerelease(tag.slice(1))).sort((left, right) => semver.rcompare(left.slice(1), right.slice(1))); if (tags[0]) process.stdout.write(tags[0])')"
          test "$latest" = "$TAG"

          release_ids="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id"
          )"
          if [[ "$release_ids" == *$'\n'* || ! "$release_ids" =~ ^[0-9]+$ ]]; then
            echo "Expected exactly one draft GitHub Release for $TAG." >&2
            exit 1
          fi
          release_state="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_ids" \
              --jq '[.tag_name, (.draft | tostring)] | @tsv'
          )"
          test "$release_state" = "$TAG"$'\ttrue'
          echo "release_id=$release_ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-v${{ inputs.version }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Recompress the oversized npm package without changing its tar payload
        env:
          PACKAGE_ASSET: cyberful-org-cyberful-linux-x64-${{ inputs.version }}.tgz
        shell: bash
        run: |
          bun scripts/optimize-npm-package.ts --file "release-assets/$PACKAGE_ASSET"
          bun scripts/write-checksums.ts release-assets
      - name: Reconcile only the recompressed draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ASSET: cyberful-org-cyberful-linux-x64-${{ inputs.version }}.tgz
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          # ── Recovery Mutates Only Two Named Draft Assets ─────────────
          # The failed run already staged a complete draft whose other files must
          # remain byte-identical. Recovery permits replacement only for the npm
          # tarball whose deflate stream changed and the checksum manifest that
          # records that new digest. Matching retries preserve both assets, while
          # any mismatch elsewhere still fails closed in the uploader below.
          # ─────────────────────────────────────────────────────────────
          for asset_name in "$PACKAGE_ASSET" SHA256SUMS; do
            local_digest="sha256:$(sha256sum "release-assets/$asset_name" | cut -d' ' -f1)"
            asset_record="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                --jq ".assets[] | select(.name == \"$asset_name\") | [.id, .digest] | @tsv"
            )"
            if [[ "$asset_record" == *$'\n'* || -z "$asset_record" ]]; then
              echo "Expected exactly one staged asset named $asset_name." >&2
              exit 1
            fi
            IFS=$'\t' read -r asset_id remote_digest <<< "$asset_record"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ "$remote_digest" = "$local_digest" ]]; then
              continue
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --silent
          done
          bun scripts/upload-release-assets.ts \
            --tag "$TAG" \
            --release-id "$RELEASE_ID" \
            --directory release-assets
      - name: Publish missing npm packages, then the launcher
        shell: bash
        run: >-
          bun scripts/publish-npm.ts
          --directory release-assets
          --version "$RELEASE_VERSION"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true \
            --silent
          for attempt in {1..12}; do
            state="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                --jq '[.tag_name, (.draft | tostring), (.immutable | tostring)] | @tsv'
            )"
            if [[ "$state" = "$TAG"$'\tfalse\ttrue' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Release $TAG was not published and locked as immutable." >&2
          exit 1

  required:
    name: Release required
    if: always()
    needs: [verify, build, assemble, stage-release, publish-npm, publish-release, resume-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require the selected release path
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RESULT: ${{ needs.resume-release.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          STAGE_RESULT: ${{ needs.stage-release.result }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
        shell: bash
        run: |
          if [[ -n "$RESUME_RUN_ID" ]]; then
            test "$DRY_RUN" != true
            test "$RESUME_RESULT" = success
            exit 0
          fi
          test "$VERIFY_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$ASSEMBLE_RESULT" = success
          if [[ "$DRY_RUN" != true ]]; then
            test "$STAGE_RESULT" = success
            test "$NPM_RESULT" = success
            test "$RELEASE_RESULT" = success
          fi
