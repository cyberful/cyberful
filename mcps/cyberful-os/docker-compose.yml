services:
  cyberful-os:
    build:
      context: .
    image: cyberful-os:latest
    container_name: ${CYBERFUL_OS_CONTAINER:-cyberful-os}
    hostname: ${CYBERFUL_OS_CONTAINER:-cyberful-os}
    working_dir: ${CYBERFUL_OS_MOUNT:-/workspace}
    volumes:
      - ${CYBERFUL_OS_WORKSPACE:-../..}:${CYBERFUL_OS_MOUNT:-/workspace}
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    tty: true
    stdin_open: true
    labels:
      org.cyberful.managed: ${CYBERFUL_MANAGED:-dependency}
      org.cyberful.owner-pid: ${CYBERFUL_OWNER_PID:-0}
      org.cyberful.run-owner: ${CYBERFUL_RUN_OWNER:-unowned}
      org.cyberful.runtime: ${CYBERFUL_RUNTIME:-dependency}
      org.cyberful.session: ${CYBERFUL_SESSION:-shared}
    command: ["sleep", "infinity"]
