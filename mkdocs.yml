# ── Documentation Site Configuration ─────────────────────────────
# Builds the public Cyberful guide with a local-font, telemetry-free Material
# theme and keeps navigation, repository links, and strict validation central.
# → docs-overrides/main.html — adds the product announcement to every page.
# @docs/development/release.md
# ─────────────────────────────────────────────────────────────────

site_name: Cyberful Docs
site_description: Learn, use, and contribute to the Cyberful application-security workbench.
site_author: Cyberful
site_url: https://cyberful.io/
repo_url: https://github.com/cyberful/cyberful
repo_name: cyberful/cyberful
edit_uri: edit/main/docs/
copyright: Cyberful is open source under AGPL-3.0-only.
docs_dir: docs
site_dir: site
use_directory_urls: true

exclude_docs: |
  SUMMARY.md

theme:
  name: material
  custom_dir: docs-overrides
  language: en
  font: false
  favicon: assets/favicon.svg
  icon:
    logo: material/shield-lock-outline
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cyberful/cyberful
      name: Cyberful on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

nav:
  - Overview: README.md
  - Start:
      - What you need: getting-started/requirements.md
      - Install Cyberful: getting-started/install.md
      - Your first penetration test: getting-started/README.md
  - Use Cyberful:
      - Choose a workflow: user-guide/workflows.md
      - Terminal interface: user-guide/interface.md
      - Sessions, configuration, and reports: user-guide/sessions-and-reports.md
      - Agent providers and fallback: user-guide/settings.md
  - How Cyberful works:
      - The system: concepts/architecture.md
      - Phases, tools, and safety: concepts/execution-model.md
  - Security tools:
      - Overview: runtimes/README.md
      - cyberful-os: runtimes/cyberful-os.md
      - Browser: runtimes/browser.md
      - OWASP ZAP: runtimes/zap.md
      - Ghidra: runtimes/ghidra.md
      - EVM lab: runtimes/evm.md
  - Build with us:
      - Contributing: development/README.md
      - Testing: development/testing.md
      - Releases: development/release.md
